name: Swiggy Stock Tracker

on:
  schedule:
  - cron: '45 3 * * 1-5'   # 09:15 IST - Market open
  - cron: '20 10 * * 1-5'  # 15:50 IST - Final capture
  
jobs:
  fetch-swiggy-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install bsedata requests pytz

      - name: Run Swiggy tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swiggy_alert.py
